site_name: CloudScope Web
site_description: Documentation for the CloudScope Web static viewer for CloudScope analysis datasets.
site_url: https://mapmanager.github.io/cloudscope-web/docs/
repo_url: https://github.com/mapmanager/cloudscope-web
repo_name: mapmanager/cloudscope-web
docs_dir: docs
site_dir: dist/docs

nav:
  - Home: index.md
  - User guide:
      - Overview: user-guide/index.md
      - Using CloudScope Web: user-guide/using-cloudscope-web.md
      - Sharing a view: user-guide/sharing.md
  - Publishing:
      - Publishing a CloudScope dataset: publishing/index.md
  - Technical information:
      - Overview: technical/index.md
      - Architecture: technical/architecture.md
      - Data format: technical/data-format.md
      - Development: technical/development.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra:
  links:
    cloudscope_web: https://mapmanager.github.io/cloudscope-web/
    cloudscope_app: https://mapmanager.github.io/cloudscope-app/
    acqstore: https://mapmanager.github.io/acqstore/
